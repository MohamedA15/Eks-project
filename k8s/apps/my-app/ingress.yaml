apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-app
  namespace: eks-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - app.moamiin.org
      secretName: eks-app-tls

  rules:
    - host: app.moamiin.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-app
                port:
                  number: 8080