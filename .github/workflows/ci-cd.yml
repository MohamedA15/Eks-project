name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 688372068827.dkr.ecr.eu-west-2.amazonaws.com
  ECR_REPOSITORY: eks-app
  DEPLOYMENT_FILE: k8s/apps/my-app/deployment.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci: update image tag')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688372068827:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker build -t $IMAGE_URI ./app
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan image with Grype
        uses: anchore/scan-action@v3
        with:
          image: ${{ steps.build.outputs.image_uri }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Push Docker image to ECR
        run: docker push ${{ steps.build.outputs.image_uri }}

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:.*|${{ steps.build.outputs.image_uri }}|g" ${{ env.DEPLOYMENT_FILE }}

      - name: Commit and push updated deployment.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ${{ env.DEPLOYMENT_FILE }}
          git commit -m "ci: update image tag to ${{ steps.build.outputs.image_tag }}"
          git push